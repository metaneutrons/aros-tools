[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Empty on purpose. The workspace takes every dependency from crates.io, so
# `unknown-git = "deny"` refuses any git source outright. The only entry this
# list ever held was a fork of tftp-rs, carried until upstream released the
# interface-bound server in 0.4.0. Add a source here only with the rationale
# beside the dependency, and remove it again once upstream catches up.
allow-git = []
