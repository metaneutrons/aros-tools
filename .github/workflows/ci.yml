name: Workspace CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the title, the body and every commit
        shell: bash
        # Title and body reach the script only through env, never by
        # interpolation into the script text: otherwise a pull-request title
        # would be a shell injection vector.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          # grep works line by line, hence .* rather than [^\n]: in ERE that
          # class means "not a backslash and not an n" and would let through
          # any name containing an n. In the RE2 rule of a ruleset [^\n] is
          # the correct spelling.
          ban='co-authored-by:.*(claude|anthropic)|generated with.*claude code'

          # With squash merges the pull-request title becomes the subject line
          # on main, and Release Please derives the next version from it.
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::pull-request title is not a Conventional Commit: $PR_TITLE"
            status=1
          fi

          # squash_merge_commit_message is PR_BODY, so the body lands in the commit.
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::the pull-request body carries an AI attribution trailer"
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$cc"; then
              echo "::error::commit $sha is not a Conventional Commit: $subject"
              status=1
            fi
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha carries an AI attribution trailer"
              status=1
            fi
            if git log -1 --format='%ae%n%ce' "$sha" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha has an Anthropic address as author or committer"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::notice::silence the trailers for good in ~/.claude/settings.json: {\"attribution\":{\"commit\":\"\",\"pr\":\"\"}}"
            exit 1
          fi
      - name: The hook definition must stay valid
        # There is no lefthook action; evilmartians/lefthook is the tool repo.
        # The binary comes from a pinned release asset and is checked against a
        # pinned digest, because an unverified download would be the one
        # unpinned dependency in this workflow.
        env:
          LEFTHOOK_VERSION: '2.1.12'
          LEFTHOOK_SHA256: 'dad908593c859d139b886c14913a44401d95288aa7642d9bdf6f3bd36bd788ff'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lefthook.gz"
          curl -sSfL --retry 3 \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz" \
            -o "$archive"
          echo "${LEFTHOOK_SHA256}  ${archive}" | sha256sum --check --status
          gzip -dc "$archive" > "$RUNNER_TEMP/lefthook"
          chmod +x "$RUNNER_TEMP/lefthook"
          "$RUNNER_TEMP/lefthook" validate

  quality:
    name: Formatting, architecture and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and audit tools
        run: |
          set -euo pipefail
          toolchain=$(scripts/release/read-rust-toolchain.sh)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup show active-toolchain
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          actionlint_dir="$RUNNER_TEMP/actionlint-bin"
          install -d -m 0755 "$actionlint_dir"
          GOBIN="$actionlint_dir" \
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$actionlint_dir" >> "$GITHUB_PATH"
          "$actionlint_dir/actionlint" -version
          shellcheck --version
      - name: Run canonical workspace quality gate
        run: scripts/check-workspace.sh quality

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            source_qualification: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            source_qualification: false
          - name: macos-x86_64
            runner: macos-15-intel
            source_qualification: false
          - name: macos-aarch64
            runner: macos-15
            source_qualification: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout aros-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: aros-tools
          persist-credentials: false
      - name: Read the versioned source and producer contract
        if: matrix.source_qualification
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          import re
          from pathlib import PurePosixPath

          with open('aros-tools/contracts/aros-source-v1.toml', 'rb') as stream:
              contract = tomllib.load(stream)
          if contract.get('schema_version') != 1:
              raise SystemExit('unsupported AROS source contract schema')
          for section in ('source', 'producer'):
              repository = contract[section]['repository']
              commit = contract[section]['commit']
              if re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository) is None:
                  raise SystemExit(f'malformed {section} repository')
              if len(commit) != 40 or any(c not in '0123456789abcdef' for c in commit):
                  raise SystemExit(f'malformed {section} identity')
              print(f'{section}_repository={repository}')
              print(f'{section}_commit={commit}')
          workflow = contract['producer']['workflow']
          workflow_path = PurePosixPath(workflow)
          if (
              not workflow.startswith('.github/workflows/')
              or '..' in workflow_path.parts
              or workflow_path.suffix not in {'.yml', '.yaml'}
              or any(character.isspace() for character in workflow)
          ):
              raise SystemExit('malformed producer workflow path')
          print(f'producer_workflow={workflow}')
          PY
      - name: Retrieve the exact producer workflow as bounded inert data
        if: matrix.source_qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_COMMIT: ${{ steps.contract.outputs.producer_commit }}
          PRODUCER_REPOSITORY: ${{ steps.contract.outputs.producer_repository }}
          PRODUCER_WORKFLOW: ${{ steps.contract.outputs.producer_workflow }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/qualified-producer-workflow.json"
          destination="$RUNNER_TEMP/qualified-producer-workflow.yml"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1048576 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${PRODUCER_REPOSITORY}/contents/${PRODUCER_WORKFLOW}?ref=${PRODUCER_COMMIT}" \
            --output "$response"
          python3 - "$response" "$destination" <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          import re
          import sys

          source, destination = sys.argv[1:]
          with open(source, 'rb') as stream:
              document = json.load(stream)
          content = document.get('content')
          if (
              document.get('type') != 'file'
              or document.get('encoding') != 'base64'
              or not isinstance(content, str)
              or not isinstance(document.get('size'), int)
              or isinstance(document.get('size'), bool)
              or document['size'] <= 0
              or document['size'] > 524288
              or re.fullmatch(r'[0-9a-f]{40}', str(document.get('sha'))) is None
          ):
              raise SystemExit('producer workflow API response violates the bounded file contract')
          if any(character not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\n' for character in content):
              raise SystemExit('producer workflow base64 contains an unexpected character')
          try:
              payload = base64.b64decode(content.replace('\n', ''), validate=True)
          except binascii.Error as error:
              raise SystemExit(f'producer workflow is not strict base64: {error}') from error
          if len(payload) != document['size']:
              raise SystemExit('producer workflow size differs from its API metadata')
          blob = b'blob ' + str(len(payload)).encode('ascii') + b'\0' + payload
          if hashlib.sha1(blob, usedforsecurity=False).hexdigest() != document['sha']:
              raise SystemExit('producer workflow Git blob identity differs from its API metadata')
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(payload)
              stream.flush()
              os.fsync(stream.fileno())
          PY
      - name: Require producer and consumer source identities to agree
        if: matrix.source_qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 aros-tools/scripts/validate-source-contract.py \
            --contract aros-tools/contracts/aros-source-v1.toml \
            --producer-workflow "$RUNNER_TEMP/qualified-producer-workflow.yml"
      - name: Checkout qualified AROS-NX source contract
        if: matrix.source_qualification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.contract.outputs.source_repository }}
          ref: ${{ steps.contract.outputs.source_commit }}
          path: aros-source
          submodules: recursive
          persist-credentials: false
      - name: Require the exact qualified AROS-NX source identity
        if: matrix.source_qualification
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.contract.outputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ $(git -C aros-source rev-parse HEAD) != "$SOURCE_COMMIT" ]]; then
            echo '::error::qualified source checkout does not match its contract commit'
            exit 1
          fi
      - name: Activate pinned Rust toolchain
        working-directory: aros-tools
        run: |
          set -euo pipefail
          toolchain=$(scripts/release/read-rust-toolchain.sh)
          rustup toolchain install "$toolchain" --profile minimal
          rustup show active-toolchain
      - name: Run complete workspace tests against qualified source
        if: matrix.source_qualification
        working-directory: aros-tools
        env:
          AROS_TEST_SOURCE_ROOT: ${{ github.workspace }}/aros-source
        run: scripts/check-workspace.sh test
      - name: Run portable workspace tests
        if: ${{ !matrix.source_qualification }}
        working-directory: aros-tools
        run: scripts/check-workspace.sh portable-test
