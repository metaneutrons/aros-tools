name: Refresh protected APT metadata

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable stable tag; empty selects GitHub latest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aros-tools-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Reproduce immutable APT state and unsigned metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      tag_object: ${{ steps.release.outputs.tag_object }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      tag_date_epoch: ${{ steps.release.outputs.tag_date_epoch }}
      release_id: ${{ steps.release.outputs.release_id }}
      metadata_epoch: ${{ steps.metadata.outputs.metadata_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable stable release without credentials
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$main_sha" ]]; then
            echo '::error::AP7230 APT refresh workflow must run at the current protected main tip'
            exit 1
          fi
          latest_tag=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          tag=${REQUESTED_TAG:-$latest_tag}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo '::error::AP7230 APT refresh requires an exact stable SemVer tag'; exit 1;
          }
          [[ "$tag" == "$latest_tag" ]] || {
            echo '::error::AP7230 APT refresh may target only the latest stable release'; exit 1;
          }
          release=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          if [[ $(jq -r '.tag_name' <<<"$release") != "$tag" || \
                $(jq -r '.draft' <<<"$release") != false || \
                $(jq -r '.prerelease' <<<"$release") != false || \
                $(jq -r '.immutable // false' <<<"$release") != true ]]; then
            echo '::error::AP7231 APT refresh source is not an immutable stable release'
            exit 1
          fi
          release_id=$(jq -er '.id | select(type == "number" and . > 0)' <<<"$release")
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")
          tag_object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref")
          tag_data=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")
          source_commit=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_data")
          tag_date=$(jq -er '.tagger.date' <<<"$tag_data")
          tag_date_epoch=$(python3 - "$tag_date" <<'PY'
          import datetime
          import sys
          value = datetime.datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          if value.tzinfo is None:
              raise SystemExit('tag timestamp lacks a timezone')
          print(int(value.timestamp()))
          PY
          )
          printf '%s\n' "tag=$tag" "version=${tag#v}" \
            "release_id=$release_id" \
            "tag_object=$tag_object" "source_commit=$source_commit" \
            "tag_date_epoch=$tag_date_epoch" >> "$GITHUB_OUTPUT"
      - name: Download and verify the immutable release in isolation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TAG_OBJECT: ${{ steps.release.outputs.tag_object }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          TAG_DATE_EPOCH: ${{ steps.release.outputs.tag_date_epoch }}
        run: |
          set -euo pipefail
          scripts/release/verify-release-ref.sh \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --tag-object "$TAG_OBJECT" --source-commit "$SOURCE_COMMIT" \
            --tag-date-epoch "$TAG_DATE_EPOCH" >/dev/null
          scripts/release/download-release-assets.sh \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "${{ steps.release.outputs.release_id }}" \
            --version "${TAG#v}" --directory candidate --mode exact
          if find candidate -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo '::error::AP7232 release download contains a non-regular entry'; exit 1
          fi
          scripts/release/verify-candidate-inventory.sh \
            --directory candidate --version "${TAG#v}" --signed true
          scripts/release/verify-release-assets.sh \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --candidate-dir candidate
          (cd candidate && sha256sum -c SHA256SUMS)
      - name: Rebuild and compare all immutable APT package and index bytes
        id: metadata
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_PUBLIC_BASE_URL: ${{ vars.APT_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "$APT_PUBLIC_BASE_URL" == 'https://deb.metaneutrons.cc/aros-tools' ]] || {
            echo '::error::AP7233 unexpected APT public origin'; exit 1;
          }
          scripts/release/verify-apt-trust-anchor.sh \
            --fingerprint "$APT_GPG_FINGERPRINT"
          metadata_epoch=$(date +%s)
          [[ "$metadata_epoch" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::AP7233 current metadata epoch is invalid'; exit 1;
          }
          echo "metadata_epoch=$metadata_epoch" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/apt-refresh"
          scripts/release/run-apt-metadata-renderer.sh \
            candidate "$RUNNER_TEMP/apt-refresh" "$VERSION" "$metadata_epoch"
          recovery_state=$(scripts/release/verify-apt-recovery-base.sh \
            --expected-directory "$RUNNER_TEMP/apt-refresh" \
            --base-url "$APT_PUBLIC_BASE_URL" \
            --fingerprint "$APT_GPG_FINGERPRINT" --version "$VERSION")
          case "$recovery_state" in
            committed|missing-commit-point) ;;
            *) echo '::error::AP7233 APT recovery verifier returned an invalid state'; exit 1 ;;
          esac
      - name: Seal only the unsigned Release input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apt-refresh-unsigned-release
          path: ${{ runner.temp }}/apt-refresh/dists/stable/Release
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign refreshed APT metadata in isolation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: apt-signing
    env:
      APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
      METADATA_EPOCH: ${{ needs.prepare.outputs.metadata_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apt-refresh-unsigned-release
          path: ${{ runner.temp }}/unsigned
      - name: Sign only the refreshed Release metadata
        shell: bash
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/refresh-signing-gnupg"
          private_key="$RUNNER_TEMP/apt-private.asc"
          repository="$RUNNER_TEMP/apt-refresh-signed"
          cleanup() {
            trap - EXIT
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf -- "$GNUPGHOME"
            rm -f -- "$private_key"
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM
          [[ -n "$APT_GPG_PRIVATE_KEY" && -n "$APT_GPG_PASSPHRASE" && \
             "$APT_GPG_FINGERPRINT" =~ ^[0-9A-Fa-f]{40}$ && \
             "$METADATA_EPOCH" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::AP7234 APT signing identity is incomplete'; exit 1;
          }
          scripts/release/verify-apt-trust-anchor.sh \
            --fingerprint "$APT_GPG_FINGERPRINT"
          unsigned="$RUNNER_TEMP/unsigned/Release"
          actual_unsigned=$(find "$RUNNER_TEMP/unsigned" -mindepth 1 -print | \
            sed "s#^$RUNNER_TEMP/unsigned/##")
          [[ "$actual_unsigned" == Release && -f "$unsigned" && ! -L "$unsigned" ]] || {
            echo '::error::AP7234 unsigned Release handoff is not closed'; exit 1;
          }
          install -d -m 0700 "$GNUPGHOME"
          install -d "$repository/dists/stable"
          install -m 0644 "$unsigned" "$repository/dists/stable/Release"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" > "$private_key"
          chmod 0600 "$private_key"
          gpg --batch --import "$private_key" >/dev/null 2>&1
          scripts/release/verify-apt-signing-key.sh \
            --homedir "$GNUPGHOME" --fingerprint "$APT_GPG_FINGERPRINT" || {
              echo '::error::AP7234 APT signing bundle is not the one active required key'; exit 1;
            }
          gpg --no-options --batch --armor --no-emit-version --no-comments \
            --export "$APT_GPG_FINGERPRINT" \
            > "$repository/aros-tools-archive-keyring.asc"
          printf '%s' "$APT_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 \
            --faked-system-time "${METADATA_EPOCH}!" \
            --local-user "$APT_GPG_FINGERPRINT" --armor --detach-sign \
            --output "$repository/dists/stable/Release.gpg" \
            "$repository/dists/stable/Release"
          printf '%s' "$APT_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 \
            --faked-system-time "${METADATA_EPOCH}!" \
            --local-user "$APT_GPG_FINGERPRINT" --armor --clearsign \
            --output "$repository/dists/stable/InRelease" \
            "$repository/dists/stable/Release"
          cleanup
          trap - EXIT HUP INT TERM
      - name: Verify the closed signed metadata handoff without credentials
        run: |
          set -euo pipefail
          scripts/release/verify-apt-publication-inventory.sh \
            --directory "$RUNNER_TEMP/apt-refresh-signed" --mode metadata \
            --fingerprint "$APT_GPG_FINGERPRINT" --require-unexpired
      - name: Seal the closed signed metadata handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-apt-refresh
          path: ${{ runner.temp }}/apt-refresh-signed/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Commit refreshed metadata to R2
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: apt-publication
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      TAG_DATE_EPOCH: ${{ needs.prepare.outputs.tag_date_epoch }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      METADATA_EPOCH: ${{ needs.prepare.outputs.metadata_epoch }}
      APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
      APT_PUBLIC_BASE_URL: ${{ vars.APT_PUBLIC_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-apt-refresh
          path: ${{ runner.temp }}/apt-refresh-signed
      - name: Revalidate the signed handoff and current public immutable bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/apt-refresh-signed"
          scripts/release/verify-apt-publication-inventory.sh \
            --directory "$repository" --mode metadata \
            --fingerprint "$APT_GPG_FINGERPRINT" --require-unexpired
          scripts/release/verify-release-ref.sh \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --tag-object "$TAG_OBJECT" --source-commit "$SOURCE_COMMIT" \
            --tag-date-epoch "$TAG_DATE_EPOCH" >/dev/null
          scripts/release/download-release-assets.sh \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --version "$VERSION" --directory candidate --mode exact
          scripts/release/verify-candidate-inventory.sh \
            --directory candidate --version "$VERSION" --signed true
          scripts/release/verify-release-assets.sh \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --candidate-dir candidate >/dev/null
          rebuilt="$RUNNER_TEMP/apt-refresh-rebuilt"
          scripts/release/run-apt-metadata-renderer.sh \
            candidate "$rebuilt" "$VERSION" "$METADATA_EPOCH"
          cmp "$rebuilt/dists/stable/Release" \
            "$repository/dists/stable/Release"
          recovery_state=$(scripts/release/verify-apt-recovery-base.sh \
            --expected-directory "$rebuilt" --base-url "$APT_PUBLIC_BASE_URL" \
            --fingerprint "$APT_GPG_FINGERPRINT" --version "$VERSION")
          case "$recovery_state" in
            committed|missing-commit-point) ;;
            *) echo '::error::AP7234 APT recovery verifier returned an invalid state'; exit 1 ;;
          esac
      - name: Commit refreshed metadata with InRelease last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/refresh-publication-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          cleanup() {
            trap - EXIT
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || {
            echo '::error::AP7235 R2 refresh credential is missing'; exit 1;
          }
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ && \
             "$R2_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            echo '::error::AP7235 R2 refresh destination is malformed'; exit 1;
          }
          repository="$RUNNER_TEMP/apt-refresh-signed"
          rebuilt="$RUNNER_TEMP/apt-refresh-rebuilt"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          authorize_mutation() {
            GH_TOKEN="${GH_TOKEN}" scripts/release/verify-release-ref.sh \
              --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
              --tag-object "$TAG_OBJECT" --source-commit "$SOURCE_COMMIT" \
              --tag-date-epoch "$TAG_DATE_EPOCH" >/dev/null
            GH_TOKEN="${GH_TOKEN}" scripts/release/verify-release-assets.sh \
              --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
              --candidate-dir candidate >/dev/null
          }
          snapshot="$RUNNER_TEMP/apt-refresh-snapshot"
          install -d "$snapshot"
          declare -A object_state object_etag object_remote object_head
          snapshot_mutable() {
            local key=$1 label=$2 head error remote etag
            head="$snapshot/${label}.head.json"
            error="$snapshot/${label}.error"
            remote="$snapshot/${label}.object"
            if aws s3api head-object --endpoint-url "$endpoint" \
              --bucket "$R2_BUCKET_NAME" --key "$key" > "$head" 2> "$error"; then
              etag=$(jq -er '.ETag | select(type == "string" and length > 0)' "$head")
              aws s3api get-object --endpoint-url "$endpoint" \
                --bucket "$R2_BUCKET_NAME" --key "$key" --if-match "$etag" \
                "$remote" >/dev/null
              object_state["$key"]=present
              object_etag["$key"]=$etag
              object_remote["$key"]=$remote
              object_head["$key"]=$head
            elif grep -Eq '\(404\)|NoSuchKey|Not Found' "$error"; then
              object_state["$key"]=absent
            else
              echo "::error::AP7235 unable to snapshot mutable R2 state for $key"
              sed 's/^/  /' "$error" >&2
              exit 1
            fi
          }
          for arch in amd64 arm64; do
            prefix="dists/stable/main/binary-${arch}"
            snapshot_mutable "aros-tools/${prefix}/Packages" "Packages-${arch}"
            snapshot_mutable "aros-tools/${prefix}/Packages.gz" "Packages-gz-${arch}"
          done
          snapshot_mutable 'aros-tools/dists/stable/Release' Release
          snapshot_mutable 'aros-tools/dists/stable/Release.gpg' Release-gpg
          snapshot_mutable 'aros-tools/dists/stable/InRelease' InRelease

          verify_origin_immutable() {
            local file=$1 key=$2 content_type=$3 cache_control=$4 head remote etag
            head=$(mktemp "$RUNNER_TEMP/refresh-immutable-head.XXXXXX")
            remote=$(mktemp "$RUNNER_TEMP/refresh-immutable-object.XXXXXX")
            aws s3api head-object --endpoint-url "$endpoint" \
              --bucket "$R2_BUCKET_NAME" --key "$key" > "$head"
            [[ $(jq -r '.ContentType' "$head") == "$content_type" && \
               $(jq -r '.CacheControl' "$head") == "$cache_control" && \
               $(jq -r '.ContentLength' "$head") == \
                 "$(wc -c < "$file" | tr -d ' ')" ]] || {
              echo "::error::AP7235 immutable R2 metadata differs for $key"; exit 1;
            }
            etag=$(jq -er '.ETag | select(type == "string" and length > 0)' "$head")
            aws s3api get-object --endpoint-url "$endpoint" \
              --bucket "$R2_BUCKET_NAME" --key "$key" --if-match "$etag" \
              "$remote" >/dev/null
            cmp "$file" "$remote" || {
              echo "::error::AP7235 immutable R2 bytes differ for $key"; exit 1;
            }
          }
          for arch in amd64 arm64; do
            package="pool/main/a/aros-tools/aros-tools_${VERSION}_${arch}.deb"
            verify_origin_immutable "$rebuilt/$package" "aros-tools/$package" \
              'application/vnd.debian.binary-package' \
              'public,max-age=31536000,immutable'
            prefix="dists/stable/main/binary-${arch}"
            for index in Packages Packages.gz; do
              index_file="$rebuilt/${prefix}/${index}"
              digest=$(sha256sum "$index_file" | awk '{ print $1 }')
              verify_origin_immutable "$index_file" \
                "aros-tools/${prefix}/by-hash/SHA256/${digest}" \
                'application/octet-stream' 'public,max-age=31536000,immutable'
            done
          done
          verify_origin_immutable "$repository/aros-tools-archive-keyring.asc" \
            'aros-tools/aros-tools-archive-keyring.asc' \
            'application/pgp-keys' 'public,max-age=31536000,immutable'

          inrelease_key='aros-tools/dists/stable/InRelease'
          if [[ ${object_state[$inrelease_key]} == present ]]; then
            gpg --batch --dearmor \
              < "$repository/aros-tools-archive-keyring.asc" \
              > "$RUNNER_TEMP/refresh-origin-keyring.gpg"
            origin_release="$RUNNER_TEMP/refresh-origin-Release"
            gpgv --status-fd 3 \
              --keyring "$RUNNER_TEMP/refresh-origin-keyring.gpg" \
              --output "$origin_release" "${object_remote[$inrelease_key]}" \
              3> "$RUNNER_TEMP/refresh-origin.status" 2>/dev/null || {
              echo '::error::AP7235 origin InRelease signature is invalid'; exit 1;
            }
            scripts/release/verify-gpgv-status.sh \
              --status-file "$RUNNER_TEMP/refresh-origin.status" \
              --fingerprint "$APT_GPG_FINGERPRINT" || {
                echo '::error::AP7235 origin InRelease signer is not active and exact'; exit 1;
              }
            for arch in amd64 arm64; do
              for index in Packages Packages.gz; do
                expected="$rebuilt/dists/stable/main/binary-${arch}/${index}"
                expected_digest=$(sha256sum "$expected" | awk '{ print $1 }')
                expected_size=$(wc -c < "$expected" | tr -d ' ')
                read -r origin_digest origin_size < <(
                  awk -v wanted="main/binary-${arch}/${index}" '
                    $1 == "SHA256:" { section = 1; next }
                    section && $0 !~ /^ / { section = 0 }
                    section && $3 == wanted { count += 1; digest = $1; size = $2 }
                    END { if (count != 1) exit 1; print digest, size }
                  ' "$origin_release"
                ) || {
                  echo "::error::AP7235 origin Release lacks singular $arch/$index"; exit 1;
                }
                [[ "$origin_digest" == "$expected_digest" && \
                   "$origin_size" == "$expected_size" ]] || {
                  echo "::error::AP7235 origin Release differs at $arch/$index"; exit 1;
                }
              done
            done
          fi

          put_snapshot() {
            local file=$1 key=$2 content_type=$3 condition=()
            if [[ ${object_state[$key]} == present ]]; then
              if cmp -s "$file" "${object_remote[$key]}" && \
                 [[ $(jq -r '.ContentType' "${object_head[$key]}") == "$content_type" && \
                    $(jq -r '.CacheControl' "${object_head[$key]}") == no-cache && \
                    $(jq -r '.ContentLength' "${object_head[$key]}") == \
                      "$(wc -c < "$file" | tr -d ' ')" ]]; then
                return
              fi
              condition=(--if-match "${object_etag[$key]}")
            else
              condition=(--if-none-match '*')
            fi
            authorize_mutation
            aws s3api put-object --endpoint-url "$endpoint" \
              --bucket "$R2_BUCKET_NAME" --key "$key" --body "$file" \
              "${condition[@]}" --cache-control no-cache \
              --content-type "$content_type" >/dev/null
          }
          for arch in amd64 arm64; do
            prefix="dists/stable/main/binary-${arch}"
            put_snapshot "$rebuilt/${prefix}/Packages" \
              "aros-tools/${prefix}/Packages" 'text/plain; charset=utf-8'
            put_snapshot "$rebuilt/${prefix}/Packages.gz" \
              "aros-tools/${prefix}/Packages.gz" 'application/gzip'
          done
          put_snapshot "$repository/dists/stable/Release" \
            'aros-tools/dists/stable/Release' 'text/plain; charset=utf-8'
          put_snapshot "$repository/dists/stable/Release.gpg" \
            'aros-tools/dists/stable/Release.gpg' 'application/pgp-signature'
          # The signed InRelease remains the only commit point and is written
          # after every recoverable mutable alias under its original snapshot.
          put_snapshot "$repository/dists/stable/InRelease" \
            'aros-tools/dists/stable/InRelease' 'text/plain; charset=utf-8'
          cleanup
          trap - EXIT HUP INT TERM

  verify:
    name: Verify refreshed public commit point without credentials
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
      APT_PUBLIC_BASE_URL: ${{ vars.APT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-apt-refresh
          path: ${{ runner.temp }}/apt-refresh-signed
      - name: Verify refreshed public commit point
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/apt-refresh-signed"
          public="$RUNNER_TEMP/apt-refresh-public"
          error="$RUNNER_TEMP/apt-refresh-public.error"
          for attempt in {1..20}; do
            rm -rf -- "$public"
            if measured=$(scripts/release/download-verify-apt-publication.sh \
                --directory "$public" --base-url "$APT_PUBLIC_BASE_URL" \
                --fingerprint "$APT_GPG_FINGERPRINT" --version "$VERSION" \
                2> "$error"); then
              exact=true
              cmp -s "$public/aros-tools-archive-keyring.asc" \
                "$repository/aros-tools-archive-keyring.asc" || exact=false
              for name in Release Release.gpg InRelease; do
                cmp -s "$public/dists/stable/$name" \
                  "$repository/dists/stable/$name" || exact=false
              done
              if [[ "$measured" == "$VERSION" && "$exact" == true ]]; then
                exit 0
              fi
            fi
            [[ "$attempt" != 20 ]] || {
              cat "$error" >&2 || true
              echo '::error::AP7236 complete refreshed APT inventory did not converge'; exit 1;
            }
            sleep 15
          done
