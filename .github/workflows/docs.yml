name: Documentation

on:
  # `build` is a protected-branch check, so every pull request must produce it.
  # Path-filtering a required workflow leaves unrelated pull requests blocked
  # forever in GitHub's "Expected" state.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Run canonical documentation gate
        run: scripts/check-workspace.sh docs
      - name: Upload verified Worker asset handoff
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-worker-assets-${{ github.run_id }}
          path: docs-site/worker-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment: docs-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install the locked deployment client
        working-directory: docs-site
        run: npm ci --ignore-scripts
      - name: Download the verified Worker asset handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation-worker-assets-${{ github.run_id }}
          path: docs-site/worker-dist
      - name: Deploy the path-scoped static documentation Worker
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cleanup() {
            unset CLOUDFLARE_API_TOKEN
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo '::error::AP7600 Cloudflare documentation credential is missing'
            exit 1
          }
          npm run worker:deploy
      - name: Verify the public documentation
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/aros-tools-docs.html"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output "$body" \
              --write-out '%{http_code}' --proto '=https' --tlsv1.2 \
              --max-time 30 https://aros.metaneutrons.cc/aros-tools/) || status=000
            if [[ "$status" == 200 ]] && grep -Fq '<title>AROS tools' "$body"; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          echo "::error::AP7601 public documentation did not converge (HTTP $status)"
          exit 1
