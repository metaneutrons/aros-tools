  "AROS_COLLECT_LOG_LEVEL",
  "AROS_CROSS_TOOLCHAINS_DIR",
  "AROS_DIAGNOSTIC_FORMAT",
  "AROS_FETCH_DIAGNOSTIC_FORMAT",
  "AROS_FETCH_LOG_FILE",
  "AROS_FETCH_LOG_FORMAT",
  "AROS_FETCH_LOG_LEVEL",
  "AROS_FETCH_OFFLINE",
  "AROS_FETCH_REQUIRE_CHECKSUMS",
  "AROS_GENMODULE_DIAGNOSTIC_FORMAT",
  "AROS_GENMODULE_LOG_FILE",
  "AROS_GENMODULE_LOG_FORMAT",
  "AROS_GENMODULE_LOG_LEVEL",
  "AROS_HOME",
  "AROS_HOST_COMPILER_DIR",
