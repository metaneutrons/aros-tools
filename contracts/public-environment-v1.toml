# Standard host variables consumed as documented fallback/discovery inputs;
# they are not AROS-specific API names.
ambient = ["CARGO", "HOME", "PATH", "XDG_CONFIG_HOME"]

# Debug-build failpoints and qualification inputs. These are not supported
# end-user configuration and must never silently migrate into `public`.
test_internal = [
  "AROS_FETCH_TEST_LOG_FAIL_AT",
  "AROS_FETCH_TEST_PAUSE_AT",
  "AROS_FETCH_TEST_PAUSE_MS",
  "AROS_PUBLICATION_TEST_CRASH_AT",
  "AROS_PUBLICATION_TEST_FAIL_AT",
  "AROS_PUBLICATION_TEST_PAUSE_AT",
  "AROS_PUBLICATION_TEST_PAUSE_MS",
  "AROS_TEST_SOURCE_ROOT",
  "AROS_TEST_TOOLS_DIR",
]
