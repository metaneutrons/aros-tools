[workspace]
resolver = "2"
members = [
    "crates/aros-common",
    "crates/aros-cmake-engine",
    "crates/aros-board",
    "crates/aros-ahi-runner",
    "crates/aros-fetch",
    "crates/aros-collect",
    "crates/aros-transpiler",
    "crates/aros-genmodule",
    "crates/aros-romtool",
    "crates/aros-cli",
    "crates/aros-verify",
    "crates/aros-macos-disk-claim",
    "crates/aros-release",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["AROS Development Team <core@aros.org>", "Fabian Schmieder <@metaneutrons>"]
license = "GPL-3.0-or-later"
homepage = "https://aros.metaneutrons.cc/aros-tools/"
repository = "https://github.com/metaneutrons/aros-tools"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "warn"
missing_errors_doc = "warn"
doc_markdown = "allow"

[workspace.dependencies]
aros-board = { path = "crates/aros-board" }
aros-cmake-engine = { path = "crates/aros-cmake-engine" }
aros-common = { path = "crates/aros-common" }
aros-release = { path = "crates/aros-release" }
aros-macos-disk-claim = { path = "crates/aros-macos-disk-claim" }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env", "cargo", "color"] }
indicatif = { version = "0.18.6", default-features = false, features = ["rayon", "unicode-width"] }
console = "0.16.4"
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
anyhow = "1.0"

# Logging & Telemetry
tracing = "0.1"

# Concurrency & Async
rayon = "1.10"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Network & Archives
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2.5"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
futures-util = "0.3"
flate2 = "1.0"
bzip2 = "0.6"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "bzip2", "deflate64"] }

# Filesystem & Utilities
walkdir = "2.5"
glob = "0.3"
which = "8.0"
regex = "1.11"
sha2 = "0.11"
tempfile = "3.17"
semver = "1.0"
fs2 = "0.4"
# The board service must verify an address on the exact USB-ECM interface;
# this is a small native interface-enumeration crate, not an external command.
if-addrs = "0.15"
# Safe, platform-native socket options for the fail-closed DHCP interface
# binding (`SO_BINDTODEVICE` on Linux and `IP_BOUND_IF` on macOS).
socket2 = { version = "0.6", features = ["all"] }
# Pure-Rust FAT formatter/writer used only to create a staged SD-card image;
# raw-device writes have a separate, explicit safety path.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
# Safe POSIX file-descriptor operations used by the Linux SD writer to open a
# whole block device with O_EXCL | O_NOFOLLOW without local unsafe code.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "mount", "process"] }
# Minimal, typed bindings used by the macOS whole-disk claim RAII guard.
# They are linked only on macOS by the guard crate.
objc2-disk-arbitration = { version = "0.3.2", default-features = false, features = ["std", "DADisk", "DADissenter", "DASession", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDate", "CFDictionary", "CFRunLoop"] }
