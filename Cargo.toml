[workspace]
resolver = "2"
members = [
    "crates/aros-common",
    "crates/aros-transpiler",
    "crates/aros-genmodule",
    "crates/aros-romtool",
    "crates/aros-cli",
    "crates/aros-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AROS Development Team <core@aros.org>", "Fabian Schmieder <@metaneutrons>"]
license = "MIT OR Apache-2.0"
homepage = "https://aros.org"
repository = "https://github.com/metaneutrons/AROS-NG"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"

[workspace.dependencies]
aros-common = { path = "crates/aros-common" }
aros-transpiler = { path = "crates/aros-transpiler" }
aros-genmodule = { path = "crates/aros-genmodule" }
aros-romtool = { path = "crates/aros-romtool" }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env", "cargo", "color"] }
indicatif = { version = "0.17", features = ["rayon"] }
console = "0.15"
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
anyhow = "1.0"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Concurrency & Async
rayon = "1.10"
tokio = { version = "1.43", features = ["full"] }
parking_lot = "0.12"
fs2 = "0.4"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Network & Archives
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
futures-util = "0.3"

# Filesystem & Utilities
walkdir = "2.5"
glob = "0.3"
which = "7.0"
regex = "1.11"
sha2 = "0.10"
tempfile = "3.17"
