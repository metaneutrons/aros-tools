[package]
name = "aros-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Unified build, toolchain, test, and physical-board workflow for AROS"

[package.metadata.deb]
name = "aros-tools"
maintainer = "Fabian Schmieder <436979+metaneutrons@users.noreply.github.com>"
copyright = "2026, AROS Development Team and Fabian Schmieder"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Native host-side build, translation, verification and board tooling for \
pristine upstream AROS and AROS-NX source checkouts."""
depends = "$auto, ca-certificates, cmake, curl, git, ninja-build, patch, python3"
section = "devel"
priority = "optional"
assets = [
    ["target/release/aros", "usr/bin/", "755"],
    ["target/release/aros-ahi-runner", "usr/bin/", "755"],
    ["target/release/aros-collect", "usr/bin/", "755"],
    ["target/release/aros-fetch", "usr/bin/", "755"],
    ["target/release/aros-genmodule", "usr/bin/", "755"],
    ["target/release/aros-romtool", "usr/bin/", "755"],
    ["target/release/aros-transpiler", "usr/bin/", "755"],
    ["target/release/aros-verify", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/aros-tools/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/aros-tools/LICENSE", "644"],
]

[lints]
workspace = true

[[bin]]
name = "aros"
path = "src/main.rs"

[dependencies]
aros-board.workspace = true
aros-cmake-engine.workspace = true
aros-common.workspace = true
aros-release.workspace = true
clap.workspace = true
console.workspace = true
indicatif.workspace = true
miette.workspace = true
thiserror.workspace = true
which.workspace = true
tokio.workspace = true
reqwest.workspace = true
tar.workspace = true
xz2.workspace = true
futures-util.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
rustix.workspace = true
