[package]
name = "aros-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "aros"
path = "src/main.rs"

[features]
default = []
# Kept as a no-op compatibility feature for early local users.  The Pi lab
# TFTP implementation is now part of the normal `aros` binary.
pi-lab-tftp = []

[dependencies]
aros-common.workspace = true
aros-transpiler.workspace = true
clap.workspace = true
console.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
miette.workspace = true
anyhow.workspace = true
which.workspace = true
tokio.workspace = true
reqwest.workspace = true
tar.workspace = true
flate2.workspace = true
xz2.workspace = true
futures-util.workspace = true
sha2.workspace = true
serde_json.workspace = true
tempfile.workspace = true
serde.workspace = true
toml.workspace = true
walkdir.workspace = true
if-addrs.workspace = true
socket2.workspace = true
fatfs.workspace = true
rustix.workspace = true
tftp-rs = { git = "https://github.com/metaneutrons/tftp-rs.git", rev = "f29959b", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
aros-macos-disk-claim.workspace = true
