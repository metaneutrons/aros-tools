[package]
name = "aros-macos-disk-claim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Fail-closed macOS Disk Arbitration whole-disk claim guard for AROS tooling"
keywords = ["macos", "disk-arbitration", "sd-card", "aros"]
categories = ["os::macos-apis", "hardware-support"]

# This crate deliberately does not inherit the workspace's `unsafe_code =
# "forbid"`: the private macOS FFI module needs a few audited unsafe calls.
# The library itself denies unsafe code, and only that module opts back in.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-disk-arbitration.workspace = true
objc2-core-foundation.workspace = true
