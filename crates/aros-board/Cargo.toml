# 0.4 is the first release whose server binds to one named interface. The board
# service must fail closed on that network boundary, so the floor is a
# requirement and not a preference. Wildcard listeners are refused by
# tftp::serve_read_only through server::validate_bind_addr, not by the library.
tftp-rs = { version = "0.4", default-features = false }

