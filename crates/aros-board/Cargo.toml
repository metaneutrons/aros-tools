# crates.io 0.3.2 cannot bind its server socket to one named interface.  The
# board service must fail closed on that network boundary, so this reviewed
# fork commit is intentionally immutable until the capability is released
# upstream.  See metaneutrons/tftp-rs commit f29959b6.
tftp-rs = { version = "0.3.2", git = "https://github.com/metaneutrons/tftp-rs.git", rev = "f29959b671c6de6654a19955c5f74803b60afe1b", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
aros-macos-disk-claim.workspace = true
